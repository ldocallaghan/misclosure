name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests and the R and Julia encoders, Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no major tags from v8 on, so it is pinned to a release.
      - uses: astral-sh/setup-uv@v10.4.0
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install jsonlite
        run: Rscript -e 'install.packages("jsonlite")'
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.11"
      - run: uv sync --locked -p ${{ matrix.python }}
      - name: ruff check
        if: matrix.python == '3.11'
        run: uv run ruff check .
      - name: ruff format check
        if: matrix.python == '3.11'
        run: uv run ruff format --check .
      - name: Unit tests, the growth server over stdio and HTTP, and the encoders
        run: MISCLOSURE_JULIA=julia uv run pytest -v

  kite:
    # The proof against kite-mcp needs R, KITE at its pinned commit and a
    # kite-mcp build. It runs when the repository variable MISCLOSURE_KITE is 1.
    name: Proof against kite-mcp
    if: vars.MISCLOSURE_KITE == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ldocallaghan/kite-mcp
          path: kite-mcp
      - uses: astral-sh/setup-uv@v10.4.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.2"
          use-public-rspm: true
      - name: Install R packages and KITE at kite-mcp's pinned commit
        run: Rscript kite-mcp/scripts/install-r-deps.R
      - name: Build kite-mcp
        run: cargo build --release --manifest-path kite-mcp/Cargo.toml
      - run: uv sync --locked -p 3.11
      - name: Conformance and scoring against kite-mcp
        run: |
          export KITE_MCP_DIR="$GITHUB_WORKSPACE/kite-mcp"
          export KITE_MCP_BIN="$KITE_MCP_DIR/target/release/kite-mcp"
          MISCLOSURE_KITE=1 uv run pytest -v tests/test_kite.py
          uv run misclosure conform examples/kite/cases.yaml --junit conformance-junit.xml
